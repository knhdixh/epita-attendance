datastore = "1.1.1"
work = "2.10.0"
glance = "1.1.1"
credentials = "1.3.0"
browser = "1.8.0"
coil = "2.7.0"
junit = "4.13.2"
turbine = "1.2.0"
robolectric = "4.14.1"
